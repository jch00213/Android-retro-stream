name: Build Android Rust Core

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
        # Ensure the target is added directly to the toolchain definition
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Explicitly Add Android Target (Safety Check)
        run: rustup target add aarch64-linux-android

      - name: Build Rust Crate for ARM64 Android via cargo-ndk
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo ndk \
            --target arm64-v8a \
            --platform 24 \
            build --release

      - name: Upload Native Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: librust_core
          path: target/aarch64-linux-android/release/librust_core.so
