name: Build Android Rust Core

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: "26.1.10909125" # Stable NDK version for modern cargo-ndk compatibility

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Crate for ARM64 Android
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo ndk \
            --target arm64-v8a \
            --platform 24 \
            --build-dir target \
            build --release -vv

      - name: Upload Native Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: librust_core
          path: target/aarch64-linux-android/release/librust_core.so
